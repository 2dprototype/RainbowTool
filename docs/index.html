<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css"" />
</head>
<body>
    <div class="weather-app">
        <div class="header">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search city...">
                    <div class="search-results" id="searchResults"></div>
                </div>
                <button class="btn-icon" id="searchBtn"><i class="bi bi-search"></i> Search</button>
                <button class="btn-icon" id="geoBtn"><i class="bi bi-geo-alt-fill"></i> Location</button>
            </div>
        </div>

        <div class="current-weather">
            <div class="d-flex align-items-start">
                <div class="weather-icon" id="weatherIcon"><i class="bi bi-brightness-high-fill"></i></div>
                <div class="flex-grow-1">
                    <div class="temp-main" id="mainTemp">--°</div>
                    <div class="text-muted small" id="mainFeels">Feels --°</div>
                </div>
                <div class="text-end">
                    <div class="location" id="location">--</div>
                    <div class="date" id="date"></div>
                    <div class="weather-desc" id="weatherDesc">--</div>
                </div>
            </div>
            <div class="meta-grid mt-3">
                <div class="meta-item"><span><i class="bi bi-droplet"></i> Humidity</span><span id="humidity">--</span></div>
                <div class="meta-item"><span><i class="bi bi-wind"></i> Wind</span><span id="wind">--</span></div>
                <div class="meta-item"><span><i class="bi bi-arrow-down"></i> Pressure</span><span id="pressure">--</span></div>
                <div class="meta-item"><span><i class="bi bi-sun"></i> UV</span><span id="uv">--</span></div>
            </div>
        </div>

        <div class="features-section">
            <h6 class="mb-3"><i class="bi bi-stars"></i> Weather Features</h6>
            <div class="features-grid" id="featuresGrid"></div>
        </div>

        <div class="tables-section">
            <div class="table-container">
                <div class="table-title"><i class="bi bi-clock-history"></i> Hourly Forecast</div>
                <div style="overflow-x: auto; max-height: 350px;">
                    <table class="data-table" id="hourlyTable">
                        <thead>
                            <tr><th>Time</th><th>Icon</th><th>Temp</th><th>Rainbow</th><th>Sun Angle</th></tr>
                        </thead>
                        <tbody id="hourlyBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="table-container">
                <div class="table-title"><i class="bi bi-calendar3"></i> 14-day Weather</div>
                <div style="overflow-x: auto; max-height: 350px;">
                    <table class="data-table" id="dailyTable">
                        <thead>
                            <tr><th>Date</th><th>Day</th><th>Icon</th><th>High/Low</th><th>Rainbow</th></tr>
                        </thead>
                        <tbody id="dailyBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <button class="rainbow-help" id="helpBtn"><i class="bi bi-question-lg"></i></button>

    <div class="modal" id="helpModal">
        <div class="modal-content">
            <div class="modal-header">
                <h6><i class="bi bi-rainbow"></i> Rainbow Prediction Formula</h6>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script type="text/javascript" src="main.js"></script>
</body>
</html>
